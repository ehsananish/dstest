name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle testReleaseUnitTest assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/app.apk

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          profile: pixel_4
          script: bash -c 'set -x; mkdir -p shots; adb install -r app.apk; adb logcat -b crash -c; adb shell settings put global hide_error_dialogs 1; sleep 20; A=ir.ehsananish.dstest/.MainActivity; S=$(adb shell wm size | tail -1 | grep -oE "[0-9]+x[0-9]+"); W=${S%x*}; H=${S#*x}; adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true; adb shell svc power stayon true || true; adb shell am force-stop com.google.android.apps.nexuslauncher || true; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true; sleep 4; adb shell input tap $((W*3/10)) $((H*56/100)) || true; sleep 1; adb shell am start -W -n $A; sleep 12; adb exec-out screencap -p > shots/1-onboarding.png; adb shell am start -W -S -n $A --ez skip_onboarding true --ez demo_data true; sleep 5; adb exec-out screencap -p > shots/2-home.png; adb shell input swipe $((W/2)) $((H*2/3)) $((W/2)) $((H/4)); sleep 2; adb exec-out screencap -p > shots/3-home-scrolled.png; adb shell am start -W -S -n $A --ei open_tab 1; sleep 5; adb exec-out screencap -p > shots/4-tab2.png; adb shell am start -W -S -n $A --ei open_tab 2; sleep 5; adb exec-out screencap -p > shots/10-insights.png; adb shell am start -W -S -n $A --ei open_tab 3; sleep 5; adb exec-out screencap -p > shots/11-journal.png; adb shell am start -W -S -n $A --ei open_tab 4; sleep 5; adb exec-out screencap -p > shots/12-more.png; adb shell am start -W -S -n $A --ez open_entry true; sleep 6; adb exec-out screencap -p > shots/13-sheet.png; adb shell am start -W -S -n $A --ei open_tab -1; sleep 5; adb exec-out screencap -p > shots/5-settings.png; adb shell cmd uimode night yes; sleep 1; adb shell am start -W -S -n $A; sleep 5; adb exec-out screencap -p > shots/6-home-dark.png; adb shell cmd uimode night no; sleep 1; adb shell am start -W -S -n $A --ez alt_style true; sleep 5; adb exec-out screencap -p > shots/7-alt-style-home.png; adb shell am start -W -S -n $A --ei open_tab -1; sleep 5; adb exec-out screencap -p > shots/8-alt-style-settings.png; adb shell cmd uimode night yes; sleep 1; adb shell am start -W -S -n $A; sleep 5; adb exec-out screencap -p > shots/9-alt-style-dark.png; adb shell cmd uimode night no; sleep 1; adb shell am start -W -S -n $A --ez big_font true; sleep 5; adb exec-out screencap -p > shots/14-big-font.png; adb logcat -d -b crash > shots/crash-log.txt || true'

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
